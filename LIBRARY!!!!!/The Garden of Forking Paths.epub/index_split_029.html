<dt id="note_15" class="calibre8">[<a href="index_split_012.html#back_note_15" title="15" class="calibre9">←15</a>]</dt><dd class="calibre10" id="calibre_pb_29"><p class="block_22"><sup class="calibre11"></sup> <span class="text_9">Let me reiterate that for a book to exist it has only to be possible. The impossible alone is excluded. For example, no book is also a stairway, although there are certainly books that argue or deny or demonstrate the possibility and others whose structure resembles that of a stairway.</span></p><p class="block_"> </p></dd>
