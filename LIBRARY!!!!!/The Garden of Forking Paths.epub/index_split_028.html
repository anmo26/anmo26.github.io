<dt id="note_14" class="calibre8">[<a href="index_split_012.html#back_note_14" title="14" class="calibre9">←14</a>]</dt><dd class="calibre10" id="calibre_pb_28"><p class="block_21"><sup class="calibre11"></sup> <span class="text_9">Formerly, for every three hexagons, there was one man. Suicides and lung diseases have upset the ratio. There have been times when I travelled for nights along corridors and worn stairways without finding a single librarian. The memory of this fills me with inexpressible melancholy.</span></p><p class="block_19"> </p></dd>
