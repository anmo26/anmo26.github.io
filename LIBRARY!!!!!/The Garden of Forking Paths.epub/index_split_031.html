<dt id="note_17" class="calibre8">[<a href="index_split_013.html#back_note_17" title="17" class="calibre9">←17</a>]</dt><dd class="calibre12"><p class="block_22"><sup class="calibre11"></sup> <span class="text_2">An outrageous and despicable suggestion. The Prussian spy Hans Rabener, alias Viktor Runeberg, drew an automatic pistol on Captain Richard Madden, the bearer of an arrest warrant. In self-defence, Madden inflicted wounds from which Runeberg later died. [</span><span class="text_3">Editor’s Note.</span><span class="text_2">]</span></p><p class="block_"> </p></dd></dl>
